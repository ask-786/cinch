<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cinch — media tools that never leave your device</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Convert, compress and trim video, audio and images entirely in your browser. No upload, no account, no server."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('cinch.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (_) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
